이름:일일 특가 자동화

~에:
  일정:
    # 한국 시간 기준 09시, 12시, 15시, 18시, 21시 (UTC 기준 0, 3, 6, 9, 12시)
    - 크론:'0 0,3,6,9,12 * * *'
  워크플로우_디스패치: #수동 테스트 실행 버튼 제공

일자리:
  런봇:
    계속 실행행:무분투 최신 버전
    단계:
      - 이름:저장소를 확인하세요
        사용:actions/checkout@v3

      - 이름:Python 설정
        사용:actions/setup-python@v4
        ~와 함께:
          파이썬 버전: '3.10'

      - 이름:필수 구성 요소를 설치합니다.
        달리다:|
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - 이름:자동화 봇 실행
        환경:
          쿠팡_액세스_키:${{ secrets.COUPANG_ACCESS_KEY }}
          쿠팡_비밀_키:${{ secrets.COUPANG_SECRET_KEY }}
          내_이메일:${{ secrets.MY_EMAIL }}
          앱_비밀번호:${{ secrets.APP_PASSWORD }}
        달리다:|
          파이썬 봇.파이
