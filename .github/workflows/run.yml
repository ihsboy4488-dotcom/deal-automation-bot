name: 일일 특가 자동화

on:
  schedule:
    # 한국 시간 기준 09시, 12시, 15시, 18시, 21시 (UTC 기준 0, 3, 6, 9, 12시)
    - cron: '0 0,3,6,9,12 * * *'
  workflow_dispatch: # 수동 테스트 실행 버튼 제공

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v3

      - name: Python 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: 자동화 봇 실행
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          RECEIVER_EMAILS: ${{ secrets.RECEIVER_EMAILS }}
        run: |
          python 봇.py
